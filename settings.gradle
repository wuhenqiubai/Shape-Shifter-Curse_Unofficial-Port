pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Fabric-Hangbing_Proxy'
            url = "https://repository.hanbings.io/proxy"
        }
    }
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version settings.providers.gradleProperty('loom_version').get()
    }
}

include 'apoli'
include 'calio'
include 'bom'

rootProject.name = "Shape-Shifter-Curse_Unofficial-Port"
