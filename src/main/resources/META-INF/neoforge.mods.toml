modLoader="javafml"
loaderVersion="[4,5)"
license="MIT"

# NeoForge/Connector compatibility: this FML metadata is only a placeholder (declares deps + shows a
# clear error when connector is missing). Actual loading is done by Connector via fabric.mod.json.
[properties]
"connector:placeholder"=true

[[mods]]
# FML modId must be lowercase alphanumeric + underscores (no hyphens). The fabric.mod.json id has
# hyphens, but the modId here must be FML-valid or FML pre-loading rejects the whole jar.
modId="shape_shifter_curse_unofficial"
version="${version}"
displayName="Shape Shifter Curse-Unofficial Port"
logoFile="assets/shape-shifter-curse/icon.png"
authors="onixary, XuHaoNan, wuhenqiubai"
description='''An unofficial port of the mod that allows you to gradually transform into different vanilla creatures, each with unique models and animations.'''

[[dependencies."shape_shifter_curse_unofficial"]]
modId="neoforge"
type="required"
versionRange="[21.1,26)"
ordering="NONE"
side="BOTH"

[[dependencies."shape_shifter_curse_unofficial"]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies."shape_shifter_curse_unofficial"]]
modId="connector"
type="required"
versionRange="*"
ordering="NONE"
side="BOTH"
