// 聚合 BOM —— 布局与做法参照 FabricAPI 的 fabric-api-bom（java-platform + constraints）。
//
// 作用：本仓库现在是 monorepo，SSCU / Apoli-Legacy / Calio-Legacy 三个模块共用同一个 group + version
// （由根 build.gradle 的 subprojects {} 统一设置）。消费者只要
//     modImplementation platform("net.wuhenqiubai:shape-shifter-curse-bom:<version>")
//     modImplementation "net.wuhenqiubai:shape-shifter-curse-unofficial:<version>"
// 就能一次把三个模块的版本对齐，不必各自写版本号。
//
// ⚠ 注意 BOM 只统一「版本」，不能让消费者凭空拿到 Apoli 的 API ——
//    那要靠 SSCU 的发布元数据里 Apoli 是 compile(api) 依赖（build.gradle 里用的是 modApi project(":apoli")），
//    以及 Apoli 的坐标本身可被解析（本地开发走 publishToMavenLocal）。
plugins {
    id 'java-platform'
    id 'maven-publish'
}

// group / version 由根 build.gradle 的 subprojects {} 统一，此处不再重复声明

dependencies {
    constraints {
        // 把本构建里除 BOM 自己以外的所有项目都收进约束（根项目 ":"=SSCU 本体、:apoli、:calio）
        for (proj in rootProject.allprojects) {
            if (proj == project) {
                continue
            }
            api(project(proj.path))
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'shape-shifter-curse-bom'
            from components['javaPlatform']
        }
    }
    // 与 SSCU 的 publishing 一样不配远程仓库，只走 publishToMavenLocal
    repositories {}
}

// ⚠ 此处**不要**再把 GenerateModuleMetadata 打开。
// 根 build.gradle 里全局关掉了 .module 发布，原因是 JitPack 改写 .module 时用「仓库名」当 module 名，
// 多构件 monorepo 下四个构件的 .module 组件坐标全部对不上请求坐标，消费者一律报
// "inconsistent module metadata found"。如果这里 enabled = true，bom 会成为唯一带 .module 的构件，
// 在 JitPack 上照样解析不了。
//
// BOM 的约束不受影响：java-platform 本来就会把它们写进 POM 的 <dependencyManagement>
// （已验证生成的 POM 里四条约束齐全），消费者 platform(...) 走 POM 一样拿得到。
