plugins {
    id 'java-platform'
    id 'maven-publish'
}

dependencies {
    constraints {
        for (proj in rootProject.allprojects) {
            if (proj == project) {
                continue
            }
            api(project(proj.path))
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = 'shape-shifter-curse-bom'
            from components['javaPlatform']
        }
    }
    repositories {}
}
