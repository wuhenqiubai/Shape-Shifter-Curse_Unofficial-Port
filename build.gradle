processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}


// Patch embedded Apoli/Calio fabric.mod.json from "1.21" to "1.21.1"
// Needed because Apoli hasn't released a 1.21.1 build yet
tasks.register('fixEmbeddedModVersions') {
    group = 'fabric'
    dependsOn remapJar
    doLast {
        def sscJar = remapJar.archiveFile.get().asFile
        def tmpDir = layout.buildDirectory.dir('tmp/embedded-patch').get().asFile
        tmpDir.deleteDir()
        tmpDir.mkdirs()
        copy {
            from zipTree(sscJar)
            into tmpDir
            include 'META-INF/jars/*.jar'
        }
        def jarsDir = new File(tmpDir, 'META-INF/jars')
        jarsDir.listFiles()?.each { embedded ->
            if (embedded.name.contains('apoli') || embedded.name.contains('calio')) {
                def extractDir = new File(tmpDir, embedded.name + '-tmp')
                extractDir.mkdir()
                copy { from zipTree(embedded); into extractDir }
                def modJson = new File(extractDir, 'fabric.mod.json')
                if (modJson.exists()) {
                    def txt = modJson.text
                    txt = txt.replace('"minecraft": "1.21"', '"minecraft": "1.21.1"')
                    txt = txt.replace('"minecraft": "1.21.x"', '"minecraft": "1.21.1"')
                    modJson.text = txt
                }
//                if (embedded.name.contains('apoli')) {
//                    // Delete EquipmentMixin - restrict_armor condition context mismatch in 1.21
//                    project.delete fileTree(extractDir) { include '**/EquipmentMixin*.class' }
//                    def cfg = new File(extractDir, 'apoli.mixins.json')
//                    if (cfg.exists()) {
//                        def json = new groovy.json.JsonSlurper().parse(cfg) as Map
//                        json.mixins = json.mixins.findAll { !it.contains('EquipmentMixin') }
//                        json.client = (json.client ?: []).findAll { !it.contains('EquipmentMixin') }
//                        json.server = (json.server ?: []).findAll { !it.contains('EquipmentMixin') }
//                        cfg.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
//                    }
//                }
                embedded.delete()
                ant.jar(destfile: embedded, basedir: extractDir)
                extractDir.deleteDir()
            }
        }
        // Use jar update instead of full repack to preserve data pack structure
        ant.jar(update: true, destfile: sscJar) {
            fileset(dir: tmpDir) {
                include(name: 'META-INF/**')
            }
        }
        tmpDir.deleteDir()
    }
}
build.dependsOn fixEmbeddedModVersions

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

